name: Deploy invitation backend to test

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/request-invitation/**'
      - 'supabase/config.toml'
      - '.github/workflows/invitation-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: invitation-test
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'kazunyon/kasisougu'
    runs-on: ubuntu-latest
    env:
      # This is the existing compass-walk test project, not a production project.
      PROJECT_REF: zvuknqikqbumoswbhjau
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_TEST_DB_PASSWORD }}
    steps:
      - name: Check required GitHub secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Configure SUPABASE_ACCESS_TOKEN and SUPABASE_TEST_DB_PASSWORD in repository Actions secrets."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Link test project
        run: supabase link --project-ref "$PROJECT_REF"
      - name: Preview pending migrations
        run: supabase db push --dry-run
      - name: Apply pending migrations
        run: supabase db push
      - name: Deploy invitation function
        run: supabase functions deploy request-invitation --project-ref "$PROJECT_REF"
